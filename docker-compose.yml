# =============================================================================
# Backup Manager — Portainer stack
# Deploy via Portainer -> Stacks -> Add stack -> Web editor -> paste this file
# Set the env vars (see .env.example) in Portainer's Environment variables tab.
# =============================================================================
#
# Reachability:
#   - Internal: http://backup-manager:8085 (CF Tunnel routes here)
#   - Add CF Tunnel public hostname: backup.<your-domain> -> http://backup-manager:8085
#   - Protect with CF Access (same email policy as Portainer)
#
# Networks:
#   - edge-public:   for CF Tunnel ingress
#   - edge-egress:   for S3/R2/B2 uploads (internet)
#   - <site>_private (per existing site): so backup-manager can reach each
#     site's <slug>-postgres container via docker network DNS.
#     Add the site networks below as you onboard sites, then redeploy.
# =============================================================================

networks:
  edge-public:
    external: true
  edge-egress:
    external: true
  # Add each site's private network here as you onboard them:
  # similarpng_private:
  #   external: true
  # myshop_private:
  #   external: true

services:

  backup-manager:
    image: ${BACKUP_MANAGER_IMAGE}
    container_name: backup-manager
    # Add the host's docker group GID so the non-root `app` user can read
    # /var/run/docker.sock. Common Ubuntu values: 988 (24.04), 999 (22.04).
    # On the server, get it with:  getent group docker | cut -d: -f3
    group_add:
      - "988"
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      # Required
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Optional default S3 seed
      DEFAULT_S3_NAME: ${DEFAULT_S3_NAME:-}
      DEFAULT_S3_TYPE: ${DEFAULT_S3_TYPE:-s3}
      DEFAULT_S3_ENDPOINT: ${DEFAULT_S3_ENDPOINT:-}
      DEFAULT_S3_REGION: ${DEFAULT_S3_REGION:-auto}
      DEFAULT_S3_BUCKET: ${DEFAULT_S3_BUCKET:-}
      DEFAULT_S3_PATH_PREFIX: ${DEFAULT_S3_PATH_PREFIX:-postgres/}
      DEFAULT_S3_ACCESS_KEY: ${DEFAULT_S3_ACCESS_KEY:-}
      DEFAULT_S3_SECRET_KEY: ${DEFAULT_S3_SECRET_KEY:-}

      # Optional Portainer integration
      PORTAINER_URL: ${PORTAINER_URL:-https://portainer:9000}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}

      # Optional CF Access JWT verification
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD_TAG: ${CF_ACCESS_AUD_TAG:-}

      # Tunables
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-60}
      RETENTION_DAILY: ${RETENTION_DAILY:-7}
      RETENTION_WEEKLY: ${RETENTION_WEEKLY:-4}
      RETENTION_MONTHLY: ${RETENTION_MONTHLY:-6}

      TZ: UTC
    volumes:
      - backup_manager_data:/data
      - backup_manager_scratch:/scratch
      # Docker socket so backup-manager can pg_dump/pg_restore via docker exec
      # against each site's postgres container.
      # SECURITY: this is full docker access. Consider docker-socket-proxy
      # in front later, with containers:read + exec:create granted only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge-public        # CF Tunnel reaches here
      - edge-egress        # S3 uploads
      # Append per-site private networks here as you onboard them:
      # - similarpng_private
      # - myshop_private
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
          cpus: "0.2"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  backup_manager_data:
  backup_manager_scratch:
